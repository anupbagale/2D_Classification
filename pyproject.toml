[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cxrshortcut"
version = "2.0.0"
description = "Does a COVID-19 chest X-ray classifier look at the lungs, or at shortcuts?"
readme = "README.md"
license = "MIT"
authors = [{ name = "Anup Bagale" }]
requires-python = ">=3.10"
dependencies = [
    "tensorflow>=2.16",
    "numpy",
    "pandas",
    "scikit-learn",
    "pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning:gast.*",
    "ignore::DeprecationWarning:keras.*",
]
